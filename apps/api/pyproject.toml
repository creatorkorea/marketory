[project]
name = "marketory-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.4",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "pillow==12.3.0",
    "pytest==9.1.1",
    "python-docx==1.2.0",
    "pyyaml==6.0.3",
    "ruff==0.16.10",
]
