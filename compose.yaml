name: marketory-local
services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: marketory
      POSTGRES_PASSWORD: marketory_local
      POSTGRES_DB: marketory
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - marketory-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketory -d marketory"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  marketory-db:
